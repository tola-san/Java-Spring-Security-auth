services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT:-8080}:8080"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DB_URL: ${DB_URL:?Set DB_URL to your Render PostgreSQL JDBC URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    init: true
